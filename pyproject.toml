[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neighborhood-dna"
version = "1.0.0"
description = "Functional profile of any neighbourhood from Overture Maps Places, in 50 lines of Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marija Ercegovac" }]
keywords = ["overture-maps", "duckdb", "h3", "poi", "urban-analytics", "hill-numbers", "geoparquet", "foss4g"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
# Exact pins on purpose: DuckDB and scikit-learn both change behaviour between
# minor releases. The full transitive lock is requirements.txt.
dependencies = [
    "duckdb==1.5.6",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
# view.py only. The wheels bundle their own C libraries:
# pyogrio 0.13.0 ships GDAL 3.12.4, shapely 2.1.2 ships GEOS 3.13.1.
viz = [
    "geopandas==1.2.0",
    "shapely==2.1.2",
    "pyogrio==0.13.0",
    "pyproj==3.8.0",
    "pyarrow==25.0.1",
    "lonboard==0.16.0",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "cffconvert==2.0.0",
    "pygments==2.21.0",   # docs/build.py: the code slide
    "segno==1.6.6",       # docs/build.py: the QR code
]

[project.urls]
Repository = "https://github.com/m-erts/neighborhood-dna"
Slides = "https://m-erts.github.io/neighborhood-dna/"
Talk = "https://talks.osgeo.org/foss4g-2026/talk/ERGRGW/"

[tool.setuptools]
py-modules = ["dna"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "DTZ", "EXE"]
# zip(strict=True) would push dna.py past its 50 lines; the lengths are equal by construction.
ignore = ["B905"]
